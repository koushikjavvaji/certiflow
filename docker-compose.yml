name: certiflow

# One command starts everything:  docker compose up --build
# Every ${VAR:-default} below works with no .env file at all.

x-backend-env: &backend-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-certiflow}:${POSTGRES_PASSWORD:-certiflow}@postgres:5432/${POSTGRES_DB:-certiflow}
  REDIS_URL: redis://redis:6379
  JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-please-use-a-long-random-string}
  DEMO_MODE: ${DEMO_MODE:-true}
  WHATSAPP_URL: http://fake-whatsapp:4000
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080} # used in QR codes and WhatsApp links
  CERT_DIR: /data/certs # certificate PDFs; a volume shared by api and worker (S3 in production)
  NODE_ENV: production

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-certiflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-certiflow}
      POSTGRES_DB: ${POSTGRES_DB:-certiflow}
    ports:
      - "5432:5432" # exposed so you can inspect with DBeaver / pgAdmin
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-certiflow} -d ${POSTGRES_DB:-certiflow}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    # appendonly: queued jobs survive a Redis restart (matters from Phase 4).
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  fake-whatsapp:
    build: ./fake-whatsapp
    environment:
      FAKE_MODE: ${FAKE_MODE:-flaky} # flaky | reliable | down (also switchable live: PUT :4000/mode)
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The API applies pending migrations and the (idempotent) demo seed on startup, then
  # serves requests. It keeps no state in memory, so it can be scaled out and restarted.
  api:
    build: ./backend
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/seed.js && node dist/server.js"]
    environment:
      <<: *backend-env
      PORT: "3000"
    ports:
      - "3000:3000"
    volumes:
      - certs:/data/certs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # Same image as the API, different entrypoint. Scales separately from the API:
  #   docker compose up -d --scale worker=3
  # (BullMQ gives each job to exactly one worker; jobs of a dead worker are re-run.)
  worker:
    build: ./backend
    command: ["node", "dist/worker.js"]
    environment:
      <<: *backend-env
    volumes:
      - certs:/data/certs
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy # migrations are done once the API is healthy
      fake-whatsapp:
        condition: service_healthy

  web:
    build: ./web
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  certs:
