server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # The browser only ever talks to this origin: /api/* is forwarded to the API
  # container, so there is no CORS and no API address baked into the frontend.
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_http_version 1.1;
    proxy_buffering off;          # needed for live updates (SSE) in Phase 6
    proxy_read_timeout 1h;
  }

  location / {
    try_files $uri /index.html;   # single-page app routing
  }
}
