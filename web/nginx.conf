server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 2m;   # matches the API's limit (a CSV upload); nginx's default is 1m

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Security headers for the web app itself. The page may only load its own scripts and talk
  # to its own origin; it cannot be framed by another site.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  # The browser only ever talks to this origin: /api/* is forwarded to the API
  # container, so there is no CORS and no API address baked into the frontend.
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Forwarded-For $remote_addr;   # the real caller (not client-supplied), for rate limiting
    proxy_http_version 1.1;
    proxy_buffering off;          # needed for live updates (SSE)
    proxy_read_timeout 1h;
    # the API sends its own security headers (helmet); do not send them twice
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Content-Security-Policy;
  }

  # Built files have content hashes in their names, so they can be cached for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  # The page itself must always be re-checked, or users keep an old version.
  location = /index.html {
    expires -1;
  }

  location / {
    try_files $uri /index.html;   # single-page app routing
  }
}
